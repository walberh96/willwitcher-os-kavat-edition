# Part of kavat-files: which program answers each thing an app asks the desktop for.
# Hyprland's own answers for the screen; Yazi is the window that picks files; and GTK's
# answers when an app asks whether the system is light or dark, which is how the browser
# and the apps made like it follow the theme's mode at once.
[preferred]
default=hyprland
org.freedesktop.impl.portal.FileChooser=termfilechooser
org.freedesktop.impl.portal.Settings=gtk
