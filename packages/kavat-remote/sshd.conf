# Part of kavat-remote: who the SSH server lets in. Keys only, no passwords and no root;
# the keys are each user's own, in ~/.ssh/authorized_keys, which `kavat-remote key add`
# writes. The server itself is stopped as the system comes: remote access starts it.
PasswordAuthentication no
KbdInteractiveAuthentication no
AuthenticationMethods publickey
PermitRootLogin no
