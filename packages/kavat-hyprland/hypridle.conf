# Willwitcher-OS Kavat Edition: what happens when nobody touches the machine.
#
# hypridle reads this file until you write ~/.config/hypr/hypridle.conf, which then takes
# its place. The screen locks after ten minutes and goes dark after fifteen; the machine is
# not put to sleep. It also locks before going to sleep when you ask for that.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

listener {
    timeout = 900
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
