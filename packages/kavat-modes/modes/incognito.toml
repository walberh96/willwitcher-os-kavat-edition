# A private session. Everything goes out through the VPN chosen for it, and nothing goes
# out when the VPN drops; the mode is not entered until the VPN is up.
name  = "Incognito"
about = "Private session"

vpn = true
# true: the browser's windows that are open are put out of sight until the mode is left;
# while in the mode the browser is one apart, with the blocker as always, whose settings are
# kept in memory and deleted on leaving: that is the browser's own doing
hide_browser = true
# false: the terminal keeps no history, apps keep no list of recent files, and the clipboard is emptied on leaving
history = false
# "pause": remote access is put down while in the mode, and comes back on leaving it
remote = "pause"
