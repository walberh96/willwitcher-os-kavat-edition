# Part of kavat-base: the microphone with the noise taken out of it.
#
# It adds a microphone to the list, "Microphone, noise removed", that listens to the real
# one and lets the voice through: keys, fans and the room are left out, by RNNoise. It is
# offered first, so calls and recordings use it unless another is chosen. The Sound page of
# the settings turns it on and off; on is a link to this file in
# ~/.config/pipewire/pipewire.conf.d/.
context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "Microphone, noise removed"
      media.name       = "Microphone, noise removed"
      filter.graph = {
        nodes = [
          { type    = ladspa
            name    = rnnoise
            plugin  = /usr/lib/ladspa/librnnoise_ladspa.so
            label   = noise_suppressor_mono
            control = { "VAD Threshold (%)" = 50.0 "VAD Grace Period (ms)" = 200 "Retroactive VAD Grace (ms)" = 0 }
          }
        ]
      }
      capture.props  = { node.name = "capture.kavat_noise" node.passive = true audio.rate = 48000 }
      playback.props = { node.name = "kavat_noise_source" media.class = Audio/Source audio.rate = 48000 priority.session = 2500 }
    }
  }
]
