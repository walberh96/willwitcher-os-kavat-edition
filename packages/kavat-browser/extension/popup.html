<!doctype html>
<!-- The command console: type to find a command, Enter runs it. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Kavat console</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="console">
  <input id="find" type="text" placeholder="Type a command…" autofocus spellcheck="false" autocomplete="off">
  <ul id="list"></ul>
  <div id="said" class="said muted"></div>
  <script type="module" src="popup.js"></script>
</body>
</html>
