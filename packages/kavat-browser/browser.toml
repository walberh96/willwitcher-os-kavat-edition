# The browser's settings that are the system's own.

# The album the start page shows under its sites; the albums' page sets it too.
# start_album = "favourites"

# What a new tab shows behind it: "theme", the theme's colour; "wallpaper", the desktop's
# background; or the path of a picture. The start page's own button and the Browser page of
# the settings set it too.
# start_background = "theme"

# YouTube's Shorts: false, they are hidden wherever YouTube shows them; true brings them
# back. `kavat-browser shorts on|off` and the Browser page of the settings set it too.
# shorts = false

# A profile of the browser for a mode: a window opened while that mode is in force is that
# profile's, with its own history, its own sessions and its own passwords. A mode with no
# line here uses the browser's first profile.
[profiles]
# gamer = "Gaming"
# incognito = "Private"
