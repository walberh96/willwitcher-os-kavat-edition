# Part of kavat-boot: settings for grub-mkconfig, read after /etc/default/grub.

# The look of the boot menu. kavat-theme makes it from the theme of the system.
GRUB_THEME=/boot/grub/themes/kavat/theme.txt

# What the Boot page of the settings, kavat-boot-settings, keeps: how long the menu waits,
# and whether the system starts quietly and behind its loading screen.
if [ -r /etc/kavat/boot.conf ]; then
  . /etc/kavat/boot.conf
  if [ -n "${KAVAT_BOOT_TIMEOUT}" ]; then
    GRUB_TIMEOUT="${KAVAT_BOOT_TIMEOUT}"
    # with no wait the menu is not shown, unless Shift or Esc is held
    if [ "${KAVAT_BOOT_TIMEOUT}" = 0 ]; then GRUB_TIMEOUT_STYLE=hidden; else GRUB_TIMEOUT_STYLE=menu; fi
  fi
  if [ "${KAVAT_BOOT_QUIET}" = no ]; then
    GRUB_CMDLINE_LINUX_DEFAULT="$(echo " ${GRUB_CMDLINE_LINUX_DEFAULT} " | sed -e 's/ quiet / /' -e 's/ loglevel=[0-9] / /')"
  fi
  if [ "${KAVAT_BOOT_SPLASH}" = no ]; then
    GRUB_CMDLINE_LINUX_DEFAULT="$(echo " ${GRUB_CMDLINE_LINUX_DEFAULT} " | sed -e 's/ splash / /')"
  fi
fi
