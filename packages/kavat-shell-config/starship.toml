# The prompt of Willwitcher-OS Kavat Edition: who, where, the branch, and a mark that
# turns red when the last command failed.
#
# It takes its colours from the terminal's, so it follows the theme. Nothing here starts
# a program to draw the prompt: the branch is read from the repository's own files. To have
# your own prompt, copy this file to ~/.config/starship.toml and change it there.

format = "$username$directory$git_branch$character"
add_newline = false

[username]
show_always = true
format = "[$user]($style) "
style_user = "bold blue"
style_root = "bold red"

[directory]
format = "[$path]($style)[$read_only]($read_only_style) "
style = "bold cyan"
truncation_length = 3
truncate_to_repo = true

[git_branch]
format = "[$symbol$branch]($style) "
symbol = " "
style = "purple"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
