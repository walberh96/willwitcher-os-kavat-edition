# Willwitcher-OS Kavat Edition: the system's Kitty configuration.
#
# Kitty reads this file first and ~/.config/kitty/kitty.conf after it, so what you write
# there wins.

# Colours, fonts and opacity come from the theme: kavat-theme writes them in the user's
# state folder. That is ~/.local/state unless XDG_STATE_HOME names another, as it does in
# safe mode; Kitty skips the line whose file is not there.
include ${HOME}/.local/state/kavat/theme/current/kitty/theme.conf
include ${XDG_STATE_HOME}/kavat/theme/current/kitty/theme.conf
