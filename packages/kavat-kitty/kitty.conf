# Willwitcher-OS Kavat Edition: the system's Kitty configuration.
#
# Kitty reads this file first and ~/.config/kitty/kitty.conf after it, so what you write
# there wins.

# Colours, fonts and opacity come from the theme: kavat-theme writes them in the user's
# state folder. That is ~/.local/state unless XDG_STATE_HOME names another, as it does in
# safe mode; Kitty skips the line whose file is not there.
include ${HOME}/.local/state/kavat/theme/current/kitty/theme.conf
include ${XDG_STATE_HOME}/kavat/theme/current/kitty/theme.conf

# The editor's side panels, like Claude's, are windows of Kitty's beside Neovim's, which
# the editor opens and closes by remote control. Only who has the password is listened
# to, and only for what the panels need: the line that names both comes from the program
# below, which makes the password the first time, for this user alone, and keeps it in
# ~/.config/kitty/rc-pass.
allow_remote_control password
listen_on unix:${XDG_RUNTIME_DIR}/kitty-{kitty_pid}
geninclude /usr/lib/kavat/kitty-remote-control

# A panel is placed beside the editor in the splits layout, so it is the first one. With
# one window it looks like any other, and the rest are still there to change to.
enabled_layouts splits,*

# In a panel, Ctrl+Alt+B closes it, as it does from the editor.
map --when-focus-on var:kavat_panel ctrl+alt+b close_window
