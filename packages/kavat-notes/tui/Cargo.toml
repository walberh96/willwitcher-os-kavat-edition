[package]
name = "kavat-notes-tui"
version = "0.1.0"
edition = "2024"
description = "Willwitcher-OS Kavat Edition: the notes on one screen"
license = "LicenseRef-AllRightsReserved"
publish = false

# Not in src/: that is the folder makepkg takes for itself next to a PKGBUILD.
[[bin]]
name = "kavat-notes-tui"
path = "main.rs"

[dependencies]
ratatui = "0.29"

[profile.release]
lto = true
strip = true
panic = "abort"
