[package]
name = "kav"
version = "0.1.0"
edition = "2024"
description = "Willwitcher-OS Kavat Edition: one command over pacman, with the AUR behind a reviewed list"
license = "LicenseRef-AllRightsReserved"
publish = false

# Not in src/: that is the folder makepkg takes for itself next to a PKGBUILD.
[[bin]]
name = "kav"
path = "core/main.rs"

[dependencies]
toml_edit = "0.25.19"

[profile.release]
lto = true
strip = true
panic = "abort"
