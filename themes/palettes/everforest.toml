# Everforest, dark and light.
#
# A palette is this one file. Colours that do not read well enough where they are used
# are adjusted when the theme is applied, so the file can hold the family's own.

name = "Everforest"

# The first accent is the one the palette uses when none is chosen.
[accents]
green  = "#a7c080"
aqua   = "#7fbbb3"
yellow = "#dbbc7f"
orange = "#e69875"
purple = "#d699b6"

[dark]
bg       = "#232a2e"
surface  = "#2d353b"
surface2 = "#3d484d"
text     = "#d3c6aa"
muted    = "#9da9a0"
border   = "#475258"

red      = "#e67e80"
green    = "#a7c080"
yellow   = "#dbbc7f"
blue     = "#7fbbb3"
magenta  = "#d699b6"
cyan     = "#83c092"

[light]
bg       = "#efebd4"
surface  = "#fdf6e3"
surface2 = "#e6e2cc"
text     = "#5c6a72"
muted    = "#829181"
border   = "#d5d0b8"

red      = "#f85552"
green    = "#8da101"
yellow   = "#dfa000"
blue     = "#3a94c5"
magenta  = "#df69ba"
cyan     = "#35a77c"
