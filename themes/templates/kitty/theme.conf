# Made by kavat-theme from the theme's settings; what is changed here is lost.
# The settings are in ~/.config/kavat/theme.toml.

font_family        {{ font_mono }}
font_size          {{ font_size }}
background_opacity {{ opacity }}

foreground           {{ term_fg }}
background           {{ term_bg }}
selection_foreground none
selection_background {{ selection }}
cursor               {{ cursor }}
cursor_text_color    {{ cursor_text }}
url_color            {{ info }}

active_border_color   {{ accent }}
inactive_border_color {{ border }}
bell_border_color     {{ warn }}

active_tab_foreground   {{ on_accent }}
active_tab_background   {{ accent }}
inactive_tab_foreground {{ muted }}
inactive_tab_background {{ surface2 }}
tab_bar_background      {{ bg }}

# black, red, green, yellow, blue, magenta, cyan, white; then the bright ones
color0  {{ term0 }}
color1  {{ term1 }}
color2  {{ term2 }}
color3  {{ term3 }}
color4  {{ term4 }}
color5  {{ term5 }}
color6  {{ term6 }}
color7  {{ term7 }}
color8  {{ term8 }}
color9  {{ term9 }}
color10 {{ term10 }}
color11 {{ term11 }}
color12 {{ term12 }}
color13 {{ term13 }}
color14 {{ term14 }}
color15 {{ term15 }}
