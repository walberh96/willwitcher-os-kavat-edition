# Made by kavat-theme from the theme's settings; what is changed here is lost.
# The settings are in ~/.config/kavat/theme.toml.

[theme]
source         = "custom"
custom_palette = "Kavat"
mode           = "{{ mode }}"

[theme.templates]
enable_builtin_templates   = false
enable_community_templates = false

[shell]
corner_radius_scale = {{ radius_scale }}
font_family         = "{{ font_ui }}"
# The first-run dialog the shell inherited picks a palette and a mode of its own, which
# would take the theme away from the system's.
setup_wizard_enabled = false
# When something asks for the password of an administrator, as kavat-theme boot does, the
# shell draws the dialog, with the theme. Nothing else in the system does.
polkit_agent = true

# The system's own panels are plugins of the shell, in a folder that comes with the system.
# Noctalia's two lists of plugins on the network are named here, off, so that they can be
# turned on in the shell's settings: a list that is on is fetched on every start.
[plugins]
enabled     = ["kavat/settings", "kavat/modes", "kavat/palette", "kavat/notes", "kavat/remote"]
auto_update = "none"

[[plugins.source]]
name     = "official"
kind     = "git"
location = "https://github.com/noctalia-dev/official-plugins"
enabled  = false

[[plugins.source]]
name     = "community"
kind     = "git"
location = "https://github.com/noctalia-dev/community-plugins"
enabled  = false

[[plugins.source]]
name     = "kavat"
kind     = "path"
location = "/usr/share/kavat/shell-plugins"
enabled  = true

# Turning the machine off or restarting it, from the power menu, the launcher or a key,
# closes Steam first and waits for it.
[shell.session.power]
shutdown = "/usr/lib/kavat/leave shutdown"
reboot   = "/usr/lib/kavat/leave reboot"

[shell.animation]
enabled = {{ animations }}
speed   = {{ animation_speed }}

# Until the background's picture is read, and around one that does not fill the screen, the
# colour of the theme shows.
[wallpaper]
fill_color = "surface"

# The calendar of the control center marks the days the notes have something on: a
# reminder, or a task that is due. kavat-notes keeps them as a calendar in a folder, which
# the shell reads and watches. The notes remind by themselves, so the shell does not.
[calendar]
enabled = true

[calendar.reminders]
enabled = false

[calendar.account.notes]
type = "vdir"
name = "Notes"
path = "~/.local/share/kavat/notes/calendar"

# The bar says only what is so now. What is playing shows while something is; the marks of
# the microphone, the camera and the screen, while an app uses them; the notes, while some
# are due. The clipboard's history is on Super+Shift+V and the screen's light on the
# keyboard's keys and in the control center: neither has a place here. The system's mode is
# at the end, the one in force alone: a press shows the others. The bar is yours to arrange
# in the settings, which have the last word over this.
[bar.default]
start = ["launcher", "workspaces"]
# The network's widget is the system's: a press opens the shell's own list of networks, a
# press with the right button the Network page, and on the installer's medium it says in
# words whether there is a network.
end   = ["media", "privacy", "kavat/remote:mark", "tray", "kavat/notes:due", "notifications", "keyboard_layout", "kavat/settings:network", "bluetooth", "volume", "battery", "kavat/modes:mode", "session"]

[widget.media]
hide_when_no_media = true

[widget.privacy]
hide_inactive = true
