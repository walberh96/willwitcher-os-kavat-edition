# Kavat Shell: its palette, its mode, its corners and its font.
#
# The shell has no system-wide file, so both of these are reached through links in its own
# folder: it reads every .toml there, and takes palettes from palettes/. Its own templates
# for other apps are turned off: this is the only place a colour comes from.
reload = [["kavat-shell", "msg", "config-reload"]]

[[file]]
from = "kavat-theme.toml"
link = "config:kavat-shell/kavat-theme.toml"

[[file]]
from = "Kavat.json"
link = "config:kavat-shell/palettes/Kavat.json"
