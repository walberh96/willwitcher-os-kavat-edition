# The lock screen, hyprlock: the same picture, clock and place for the password as the login.
#
# hyprlock reads its file from the user's folder each time the screen is locked, so there
# is nothing to reload. Its picture is made by /usr/lib/kavat/wallpaper, from the desktop's
# background, since hyprlock cannot read that drawing as it is.

[[file]]
from = "hyprlock.conf"
link = "config:hypr/hyprlock.conf"
