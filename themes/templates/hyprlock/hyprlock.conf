# Made by kavat-theme from the theme's settings; what is changed here is lost.
# The settings are in ~/.config/kavat/theme.toml.

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = {{ animations }}
}

background {
    monitor =
    path = ~/.cache/kavat/lock/kavat-{{ bg | hex }}-{{ accent | hex }}.png
    color = rgb({{ bg | hex }})
    blur_passes = 0
}

# The time and the day
label {
    monitor =
    text = cmd[update:1000] date +%H:%M
    color = rgb({{ text | hex }})
    font_size = 120
    font_family = {{ font_ui }} Light
    position = 0, 250
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:60000] date "+%A, %-d %B"
    color = rgb({{ muted | hex }})
    font_size = 18
    font_family = {{ font_ui }}
    position = 0, 140
    halign = center
    valign = center
}

# Who it is locked for: a circle in the accent with the first letter of the name
shape {
    monitor =
    size = 92, 92
    rounding = -1
    color = rgb({{ accent | hex }})
    border_size = 3
    border_color = rgb({{ surface | hex }})
    position = 0, 30
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:0] echo "$USER" | cut -c 1 | tr '[:lower:]' '[:upper:]'
    color = rgb({{ on_accent | hex }})
    font_size = 34
    font_family = {{ font_ui }} Semibold
    position = 0, 30
    halign = center
    valign = center
}
label {
    monitor =
    text = $USER
    color = rgb({{ text | hex }})
    font_size = 16
    font_family = {{ font_ui }} Semibold
    position = 0, -45
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 46
    rounding = {{ radius }}
    outline_thickness = 1
    outer_color = rgb({{ border | hex }})
    inner_color = rgb({{ surface | hex }})
    font_color = rgb({{ text | hex }})
    font_family = {{ font_ui }}
    check_color = rgb({{ accent | hex }})
    fail_color = rgb({{ danger | hex }})
    capslock_color = rgb({{ warn | hex }})
    placeholder_text = Password
    fail_text = That is not the password
    fade_on_empty = false
    dots_size = 0.25
    dots_spacing = 0.3
    position = 0, -110
    halign = center
    valign = center
}
