# The settings are in ~/.config/kavat/theme.toml.
# The colours in Qt's own order: window text, button, light, midlight, dark, mid, text, bright text,
# button text, base, window, shadow, highlight, highlighted text, link, visited link, alternate base,
# none, tooltip base, tooltip text, placeholder text.
