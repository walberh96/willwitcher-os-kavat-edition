<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <radialGradient id="warm" cx="1560" cy="130" r="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="{{ accent }}" stop-opacity=".24"/>
      <stop offset="1" stop-color="{{ accent }}" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="low" cx="160" cy="1080" r="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="{{ accent }}" stop-opacity=".09"/>
      <stop offset="1" stop-color="{{ accent }}" stop-opacity="0"/>
    </radialGradient>
    <!-- a little grain, so that the soft light does not break into bands -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="1" seed="7"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  1 0 0 0 0"/>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="{{ bg }}"/>
  <rect width="1920" height="1080" fill="url(#warm)"/>
  <rect width="1920" height="1080" fill="url(#low)"/>
  <rect width="1920" height="1080" filter="url(#grain)" opacity=".04"/>
  <path transform="translate(1370 190) scale(3.7)" fill="none" stroke="{{ text }}" stroke-opacity=".08" stroke-width="1.2"
        d="M18 34 L30 8 L46 30 M82 34 L70 8 L54 30 M18 34 Q16 70 50 90 Q84 70 82 34 M30 50 L42 56 L30 60 Z M70 50 L58 56 L70 60 Z M46 70 L50 74 L54 70"/>
</svg>
