<!--
  The film behind docs/video/kavat-tour.mp4. Kavat, the system's agent, shows the system around,
  as the finished system it will be.

  Every picture is the interactive mockup (docs/mockup/index.html), loaded in frames. A shot is one
  state of the mockup; while it lasts the camera moves over it, a pointer presses its real controls
  and the mockup answers as it does by hand. Nothing is drawn here that the mockup does not draw.

  Open this file in a browser to watch it play, without sound. A browser does not let one file reach
  into another, so there the pointer stays hidden and nothing is pressed. tools/make-video.cjs
  renders it to a video: it speaks each line with Supertonic-3, the voice model the design gives
  Kavat, tells this page how long each line lasts and how loud the voice is at every frame, and then
  asks for one frame at a time through setT(seconds). Nothing here reads the clock while rendering.
-->

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)), mix=(a,b,u)=>a+(b-a)*u;
const ease=u=>{u=clamp(u);return u*u*(3-2*u)}, out3=u=>1-(1-clamp(u))**3, back=u=>{u=clamp(u);const c=1.9;return 1+(c+1)*(u-1)**3+c*(u-1)**2};

// ---------------------------------------------------------------- the frames of the mockup
const shots=[], loads=[];
const frame=(h,cls,into)=>{const f=document.createElement('iframe');f.className=cls;f.src='../mockup/index.html#bare=true&'+h;into.appendChild(f);loads.push(new Promise(r=>f.addEventListener('load',r)));return f};
SEG.forEach((s,i)=>s.shots.forEach((sh,k)=>{sh.seg=i;sh.k=k;sh.w=sh.w||1;if(!Array.isArray(sh.cam&&sh.cam[0]))sh.cam=[sh.cam||[800,500,1]];
  if(sh.s)sh.f=frame(sh.s,'shot',$('#shots'));shots.push(sh)}));
const tiles=WALL.map((h,j)=>{const d=document.createElement('div');d.className='tile';$('#wall').appendChild(d);frame(h,'',d);
  return {d,x:((j%4)-1.5)*(TW+TG),y:(Math.floor(j/4)-1)*(TH+TG),o:(j%4)+Math.floor(j/4)}});
shots.forEach(sh=>(sh.tips||[]).forEach(tp=>{tp.el=document.createElement('div');tp.el.className='tip';tp.el.innerHTML='<i></i>'+tp.t;$('#tips').appendChild(tp.el)}));
// what each shot's mockup held when it loaded, so that going back in time puts it back
window.ready=Promise.all(loads).then(()=>new Promise(r=>setTimeout(r,700))).then(()=>shots.forEach(sh=>{if(!sh.f)return;
  try{const w=sh.f.contentWindow,all=JSON.parse(w.eval('JSON.stringify(S)'));sh.win=w;sh.base={};(sh.acts||[]).forEach(a=>Object.keys(a.set||{}).forEach(k=>sh.base[k]=all[k]))}catch(e){sh.win=null}}));

// ---------------------------------------------------------------- time
// a line is cut into phrases short enough for one row of caption
const phrases=say=>{const o=[];for(const s of say.match(/[^.!?:]+[.!?:]+/g).map(x=>x.trim())){
  if(s.length>66&&s.includes(', ')){const at=[...s.matchAll(/, /g)].map(m=>m.index+1),c=at.reduce((a,b)=>Math.abs(b-s.length/2)<Math.abs(a-s.length/2)?b:a);o.push(s.slice(0,c),s.slice(c).trim())}
  else if(o.length&&o[o.length-1].length<14)o[o.length-1]+=' '+s;else o.push(s)}return o};
SEG.forEach(s=>{s.ph=phrases(s.say);s.chars=s.ph.reduce((a,x)=>a+x.length,0)});
function setDurations(d){let t=0;const n=SEG.length;
  SEG.forEach((s,i)=>{s.speech=d?d[i]:s.say.split(' ').length/3;s.lead=i?CARD*.72:INTRO;s.len=s.lead+s.speech+TAIL+(i===n-1?OUTRO:0);s.t0=t;t+=s.len});
  // a line's shots share the time from the middle of its card to the middle of the next one
  SEG.forEach((s,i)=>{const a=s.t0+(i?CARD*.46:0),b=i<n-1?SEG[i+1].t0+CARD*.46:s.t0+s.len-OUTRO+.5,sum=s.shots.reduce((x,sh)=>x+sh.w,0);let c=a;
    s.shots.forEach(sh=>{sh.a=c;c+=(b-a)*sh.w/sum;sh.b=c})});
  window.total=t;
  $('#prog').querySelectorAll('u').forEach(e=>e.remove());SEG.slice(1).forEach(s=>{const u=document.createElement('u');u.style.left=(s.t0/t*1920-1.5)+'px';$('#prog').appendChild(u)});
  return t}
setDurations();
window.setDurations=setDurations;
// where each line starts speaking and where each card starts, for the tool that lays the sound
window.cues=()=>SEG.map((s,i)=>({at:s.t0+s.lead,say:s.say,card:i?s.t0:null}));
// how loud the voice is at each frame, from 0 to 1; without it the whiskers make it up
let LV=null;window.setLevels=a=>{LV=a};

// ---------------------------------------------------------------- Kavat
const WH=[[-7,10,2.2,5.2,0],[0,12,2.8,6.4,1.7],[7,10,3.3,5.8,3.1]];
$('#whs').innerHTML=WH.map(([a])=>[1,-1].map(s=>`<g transform="translate(${170+s*36} 62) scale(${s} 1) rotate(${a})"><path class="wh"/></g>`).join('')).join('');
const whp=$$('.wh');
function whiskers(t,loud,grow){whp.forEach((el,i)=>{const [,amp,k,sp,f]=WH[i>>1];const l=.07+loud*(.35+.65*Math.abs(Math.sin(t*2.3+f)*Math.sin(t*3.7+f*2+(i&1)*.5))**.6);
  let d='M0 0';for(let j=1;j<=48;j++){const u=j/48*grow;d+=` L${(128*u).toFixed(1)} ${(amp*l*2.3*Math.sqrt(u)*(1-u)**.9*Math.sin(2*Math.PI*k*u-sp*t+f)).toFixed(2)}`}el.setAttribute('d',d)})}
$('#title h1').innerHTML=[...'Willwitcher-OS'].map(c=>`<span>${c}</span>`).join('');
const letters=$$('#title h1 span'), halos=$$('.halo'), stats=$$('#stats b');

// ---------------------------------------------------------------- one frame
const camAt=(sh,u)=>{const c=sh.cam,n=c.length-1;if(!n)return c[0];const x=clamp(u)*n,j=Math.min(n-1,Math.floor(x)),e=ease(x-j);return c[j].map((v,q)=>mix(v,c[j+1][q],e))};
const view=([cx,cy,z])=>({z,tx:clamp(800-cx*z,1600-1600*z,0),ty:clamp(500-cy*z,1000-1000*z,0)});
const spot=(sh,sel)=>{try{for(const el of sh.win.document.querySelectorAll(sel)){const r=el.getBoundingClientRect();if(r.width&&r.top>=0&&r.top<1000&&r.left>=0&&r.left<1600)return [r.left+r.width/2,r.top+r.height/2]}}catch(e){}return null};
let accent=[242,169,59];
function setT(t){
  t=clamp(t,0,window.total-.001);
  const n=SEG.length, i=SEG.findIndex(s=>t<s.t0+s.len), s=SEG[i], lt=t-s.t0, last=i===n-1;
  const said=clamp((lt-s.lead)/s.speech), talking=lt>s.lead&&lt<s.lead+s.speech;
  const fr=Math.floor(t*FPS), loud=LV?(LV[fr]||0):talking?.55+.45*Math.sin(t*9)*Math.sin(t*5.3):0;
  const end=last?lt-(s.len-OUTRO):-1, bye=ease(end/1.1);          // the last picture, from 0 to 1
  const wsh=shots.find(x=>x.wall), dive=ease((t-(wsh.b-1.15))/1.15);

  // the shots: which ones show, where the camera is, and what has been pressed in them
  let top=null;
  shots.forEach((sh,j)=>{ if(!sh.f)return;
    const first=sh.k===0, after=shots[j-1]&&shots[j-1].wall, next=shots[j+1], cut=!next||next.k===0;
    const a=after?sh.a-.5:sh.a, o=t<a?0:first||after?1:ease((t-a)/XF), gone=t>=sh.b+(cut?0:XF);
    const warm=o<=0&&t>=a-WARM, on=(o>0||warm)&&!gone; sh.f.style.visibility=on?'visible':'hidden';
    if(!on){sh.on=false;return}
    const u=(t-sh.a)/(sh.b-sh.a), v=view(camAt(sh,u)); sh.v=v;
    sh.f.style.opacity=warm?1:o; sh.f.style.zIndex=warm?0:j+1;
    sh.f.style.transform=warm?`translate(${v.tx}px,${v.ty}px) scale(${v.z})`:`translate(${v.tx}px,${v.ty+(1-o)*14}px) scale(${v.z*(1+(1-o)*.035)})`;
    if(sh.win){
      const st=Object.assign({},sh.base);(sh.acts||[]).forEach(x=>{if(u<x.at){x.ran=0;return}Object.assign(st,x.set);
        if(x.run&&!x.ran){x.ran=1;try{sh.win.eval(x.run)}catch(e){}}});
      const key=JSON.stringify(st);if(key!==sh.key){sh.key=key;try{sh.win.eval('Object.assign(S,'+key+');apply()')}catch(e){}}}
    sh.on=true; if(o>=.5)top=sh; sh.u=u});

  // the accent of the picture on top colours everything around it
  if(top&&top.win)try{const m=getComputedStyle(top.win.document.querySelector('.screen')).getPropertyValue('--accent').trim().match(/^#(..)(..)(..)$/);
    if(m)accent=accent.map((c,q)=>mix(c,parseInt(m[q+1],16),.16))}catch(e){}
  if(i===0||bye>.5)accent=accent.map((c,q)=>mix(c,[242,169,59][q],.2));
  const acc=`rgb(${accent.map(Math.round).join(',')})`;document.body.style.setProperty('--acc',acc);
  [['#b1',1500,170,.3,.42],['#b2',380,930,.22,.3],['#b3',1000,520,.17,.13]].forEach(([id,x,y,sp,al],q)=>{const e=$(id);
    e.style.left=(x+Math.sin(t*sp+q*2)*190)+'px';e.style.top=(y+Math.cos(t*sp*.8+q)*120)+'px';
    e.style.background=`radial-gradient(closest-side,rgba(${q===1?'60,84,150':accent.map(Math.round).join(',')},${al}) 0,transparent 100%)`});
  $('#grid').style.transform=`translate(${Math.sin(t*.11)*18}px,${(t*5)%46}px)`;

  // the pointer and the labels, which ride on the camera of the picture on top
  const cur=$('#cur'), ring=$('#ring'); let seen=0;
  if(top&&top.win&&top.acts){const A=top.acts.filter(x=>x.sel), dur=top.b-top.a, tt=top.u*dur;
    if(A.length){const pos=A.map(x=>x.p||(x.p=spot(top,x.sel))); let p=null, press=0, rg=-1;
      A.forEach((x,q)=>{const at=x.at*dur, from=q?pos[q-1]:[pos[0]?pos[0][0]+260:1000,pos[0]?pos[0][1]+230:700], to=pos[q]; if(!to||!from)return;
        if(tt>=at-TRAVEL-.12&&(q===A.length-1||tt<A[q+1].at*dur-TRAVEL-.12)||(!p&&tt<at)){const e=ease((tt-(at-TRAVEL-.12))/TRAVEL);p=[mix(from[0],to[0],e),mix(from[1],to[1],e)-Math.sin(e*Math.PI)*26]}
        if(tt>=at-.08&&tt<at+.14)press=1; if(tt>=at&&tt<at+.5)rg=(tt-at)/.5});
      if(p){seen=ease(tt/.35)*(1-ease((tt-(A[A.length-1].at*dur+.7))/.4));const v=top.v,x=p[0]*v.z+v.tx,y=p[1]*v.z+v.ty;
        cur.style.transform=`translate(${x}px,${y}px) scale(${1.5*(press?.82:1)})`;
        ring.style.transform=`translate(${x}px,${y}px) scale(${rg<0?0:.25+out3(rg)*1.1})`;ring.style.opacity=rg<0?0:1-rg}
      else A.forEach(x=>x.p=null)}}
  cur.style.opacity=seen; if(!seen)ring.style.opacity=0;
  shots.forEach(sh=>(sh.tips||[]).forEach(tp=>{const dur=sh.b-sh.a, tt=(sh.u||0)*dur, a=tp.at*dur, b=(tp.til||1)*dur-.1;
    const o=sh===top?back((tt-a)/.42)*(1-ease((tt-b)/.25)):0, v=sh.v;
    tp.el.style.opacity=clamp(o*1.4); if(o>0&&v)tp.el.style.transform=`translate(${tp.x*v.z+v.tx}px,${tp.y*v.z+v.ty}px) translate(-50%,-50%) scale(${.6+.4*o})`}));

  // the monitor: it tilts as it breathes, lands after each card, and leaves at the end
  const land=i>=1&&!(i===1&&t<wsh.b)?1-out3((lt-CARD*.46)/1.0):0, wallOn=i===1&&t<wsh.b+.1;
  const mo=i===0?0:wallOn?ease((t-(wsh.b-.42))/.34):1-bye;
  $('#mon').style.opacity=mo; $('#rig').style.visibility=mo>0?'visible':'hidden';
  $('#mon').style.transform=`translateY(${Math.sin(t*.5)*3-land*10+bye*-40}px) rotateX(${1.6+Math.sin(t*.31)*.7+land*2.5}deg) rotateY(${Math.sin(t*.23)*2+land*-7+bye*10}deg) scale(${MS*(1-land*.045)*(1-bye*.3)*(wallOn?mix(.985,1,ease((t-(wsh.b-.42))/.6)):1)})`;
  $('#glass').style.opacity=.6+Math.sin(t*.23)*.4;

  // the wall
  const wIn=wsh.a, early=t<wIn||(last&&end>-2.5&&end<=0), wo=early?FAINT:i===1&&t<wsh.b+.1?1-ease((t-(wsh.b-.3))/.34):bye*.34;
  $('#wallrig').style.visibility=wo>0?'visible':'hidden';
  if(wo>0){const k=1-dive, sc=bye?1.16+end*.012:mix(1.1+(t-wIn)*.03,MS*1600/TW,dive), dx=-tiles[DIVE].x*sc*dive;
    $('#wall').style.opacity=wo;
    $('#wall').style.transform=`translate(${dx+(bye?Math.sin(t*.2)*30:0)}px,${(bye?-20:0)}px) rotateX(${(bye?20:26)*k}deg) rotateY(${(bye?-10:-16)*k}deg) rotateZ(${(bye?3:5)*k}deg) scale(${sc})`;
    tiles.forEach(tl=>{const p=bye||early?1:back((t-wIn-.05-tl.o*.07)/.55);tl.d.style.opacity=clamp(p*1.5);
      tl.d.style.transform=`translate(${tl.x-TW/2}px,${tl.y-TH/2+(1-p)*60}px) scale(${TW/1600*(.86+.14*p)})`})}

  // the chapter card
  const cu=i?lt/CARD:2, ca=out3(cu/.34), cb=ease((cu-.6)/.4), slab=(a,b)=>`polygon(${b*2400-200}px 0,${a*2400}px 0,${a*2400-300}px 1080px,${b*2400-500}px 1080px)`;
  $('#card').style.visibility=$('#card2').style.visibility=cu<1?'visible':'hidden';
  if(cu<1){$('#card2').style.clipPath=slab(out3(cu/.26),ease((cu-.66)/.34));$('#card').style.clipPath=slab(ca,cb);
    $('#card .n').textContent=String(i).padStart(2,'0');$('#card .k').textContent='Chapter '+i+' of '+(n-1);$('#card .t').textContent=s.ch;
    $('#card .t').style.transform=$('#card .k').style.transform=`translateX(${(1-ca)*-140+cb*260}px)`;$('#card .n').style.transform=`translateX(${(1-ca)*-320+cb*420}px)`}

  // Kavat: centre stage for the first line and at the very end, in the corner in between
  const m=i===0?0:i===1?ease(lt/(CARD*.5)):1-bye, born=ease((t-.5)/.8), open=ease((t-.12)/.3);
  const kx=mix(790,70,m), ky=mix(bye?165:300,955,m)+Math.sin(t*1.7)*4*(1-m*.7), ks=mix(3.3,1,m)*(1+loud*.035);
  $('#kavat').style.transform=`translate(${kx}px,${ky}px) scale(${ks})`;
  $('#kavat .head').style.opacity=i?1:born;
  const blink=(t%3.7)<.13&&t>2?.12:1; $$('#kavat .eye').forEach(e=>{e.style.transform=`scaleY(${blink*(i?1:open)})`;e.style.fill=i||born>.6?'#0e1016':acc});
  whiskers(t,Math.max(loud,i?0:.2*ease((t-1.1)/.3)*(1-ease((t-1.9)/.5))),i?1:ease((t-1)/.6));
  halos.forEach((h,q)=>{const p=(t*.55+q/3)%1, on=(i===0?ease((t-1.2)/.6):bye)*(1-m);h.style.opacity=on*(1-p)*(.1+loud*.5);h.style.transform=`translate(${kx+170}px,${ky+60}px) scale(${.35+p*1.5})`});

  // the words
  letters.forEach((l,q)=>{const p=i?0:back((t-1.25-q*.045)/.5);l.style.opacity=i?0:clamp(p*1.6);l.style.transform=`translateY(${(1-p)*46}px)`});
  $('#title').style.visibility=i?'hidden':'visible';$('#title p').style.opacity=ease((t-2)/.6);$('#title p').style.letterSpacing=mix(.9,.42,out3((t-2)/.9))+'em';
  $('#end').style.opacity=ease((end-.6)/.8);$('#end').style.visibility=end>0?'visible':'hidden';$('#end h2').style.transform=`translateY(${(1-out3((end-.6)/.9))*30}px)`;
  stats.forEach((b,q)=>{const p=out3((end-1.5-q*.16)/1.1);b.textContent=Math.round(+b.dataset.n*p);b.parentNode.style.opacity=ease((end-1.4-q*.16)/.5);b.parentNode.style.transform=`translateY(${(1-out3((end-1.4-q*.16)/.6))*24}px)`});
  const capO=(i===0?ease((lt-INTRO+.2)/.4):1)*(1-ease(end/.5));
  $('#lab').innerHTML=i?`<b>${String(i).padStart(2,'0')}</b>${s.ch}`:'';$('#lab').style.opacity=i?capO*ease((lt-CARD*.6)/.4):0;
  let done=0,html='';
  for(const x of s.ph){const a=done/s.chars,b=(done+x.length)/s.chars;done+=x.length;
    if(said<b||x===s.ph[s.ph.length-1]){const w=x.split(' '),k=Math.floor(clamp((said-a)/(b-a))*w.length);
      html=w.map((v,j)=>`<span class="${j<k?'said':j===k&&talking?'now':''}">${v}</span>`).join(' ');break}}
  const cap=$('#cap');cap.style.transform='';cap.innerHTML='<div>'+html+'</div>';cap.style.opacity=capO*(i?ease((lt-CARD*.55)/.3):1);
  if(i===0){cap.style.left='0';cap.style.width='1920px';cap.style.justifyContent='center';cap.style.top='872px'}
  else{cap.style.left='422px';cap.style.width='';cap.style.justifyContent='';cap.style.top='984px';const wd=cap.firstChild.scrollWidth;if(wd>1400)cap.style.transform=`scale(${1400/wd})`}
  $('#prog i').style.width=(t/window.total*1920)+'px';$('#prog').style.opacity=1-ease(end/.5);
  $('#black').style.opacity=Math.max(1-ease(t/.5),ease((t-(window.total-.7))/.6));
}
window.setT=setT;setT(0);

// watching it in a browser: fit the window and play against the clock
if(!location.hash.includes('render')){
  const fit=()=>{const k=Math.min(innerWidth/1920,innerHeight/1080);$('#stage').style.transform=`translate(${(innerWidth-1920*k)/2}px,${(innerHeight-1080*k)/2}px) scale(${k})`};
  fit();addEventListener('resize',fit);
  const at=+(location.hash.match(/t=([\d.]+)/)||[0,0])[1];
  window.ready.then(()=>{const t0=performance.now();(function loop(){setT((at+(performance.now()-t0)/1000)%window.total);requestAnimationFrame(loop)})()});
}
</script>
</body>
