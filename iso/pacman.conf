# pacman configuration for building the ISO and the kavat-* packages.
#
# tools/build-iso.sh and tools/build-repo.sh fill in the @...@ marks; pacman cannot read
# this file as it is.
#
# It holds Arch's repositories as they were on the day in iso/arch-snapshot, plus the local
# [kavat] repository. Nothing comes from the machine that runs the build: not its
# repositories, not its package cache.

[options]
HoldPkg     = pacman glibc
Architecture = x86_64
ParallelDownloads = 5
# Arch's archive is slow at times; a slow download is not a failed one
DisableDownloadTimeout
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional
CacheDir    = @CACHE@

[core]
Server = https://archive.archlinux.org/repos/@SNAPSHOT@/$repo/os/$arch

[extra]
Server = https://archive.archlinux.org/repos/@SNAPSHOT@/$repo/os/$arch

# Not signed yet: the signing key is still to be made.
[kavat]
SigLevel = Optional TrustAll
Server = file://@KAVAT_REPO@
