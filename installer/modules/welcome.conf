# The first screen: language, and whether this machine can take the system.
# No network is asked for: the base system installs without one.
---
showSupportUrl: false
showKnownIssuesUrl: false
showReleaseNotesUrl: false
requirements:
    requiredStorage: 40.0
    # a machine with 4 GB reports a little less than that
    requiredRam: 3.5
    check: [ storage, ram, power, root ]
    required: [ storage, ram, root ]
geoip:
    style: "none"
