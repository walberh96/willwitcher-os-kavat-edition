# The last step inside the new system: the installer takes itself out, with no snapshot
# taken of it, and the index of the file search is built, so that the first search of the
# whole disk already answers.
---
dontChroot: false
timeout: 300
script:
    - "SNAP_PAC_SKIP=y pacman -Rns --noconfirm kavat-installer kavat-calamares mkinitcpio-archiso"
    - "/usr/lib/kavat/find-index"
