# One user, who administers the machine with sudo. Nobody logs in as root.
---
defaultGroups:
    - name: wheel
      must_exist: true
      system: true
sudoersGroup: wheel
sudoersConfigureWithGroup: true
setRootPassword: false
doReusePassword: false
# the box "log in automatically" is shown, unchecked: the kavat-answers step tells the
# login screen who it is, with kavat-login-settings
doAutologin: false
displayAutologin: true
passwordRequirements:
    minLength: 1
    maxLength: -1
# a password of any length is taken, but not an empty one: with weak passwords allowed,
# Calamares only warns that it is too short and lets the page be left with none
allowWeakPasswords: false
allowWeakPasswordsDefault: false
user:
    shell: /usr/bin/zsh
    forbidden_names: [ root, live ]
    home_permissions: "o700"
hostname:
    location: EtcFile
    writeHostsFile: true
    template: "kavat"
    forbidden_names: [ localhost ]
allowActiveDirectory: false
