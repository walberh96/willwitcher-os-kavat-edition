# One user, who administers the machine with sudo. Nobody logs in as root.
---
defaultGroups:
    - name: wheel
      must_exist: true
      system: true
sudoersGroup: wheel
sudoersConfigureWithGroup: true
setRootPassword: false
doReusePassword: false
doAutologin: false
displayAutologin: false
passwordRequirements:
    minLength: 1
    maxLength: -1
allowWeakPasswords: true
allowWeakPasswordsDefault: true
user:
    shell: /bin/bash
    forbidden_names: [ root, live ]
    home_permissions: "o700"
hostname:
    location: EtcFile
    writeHostsFile: true
    template: "kavat"
    forbidden_names: [ localhost ]
allowActiveDirectory: false
