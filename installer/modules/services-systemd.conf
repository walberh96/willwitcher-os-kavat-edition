# NetworkManager is already enabled in the copied system. The login screen is not, since
# the live session goes straight to the desktop.
---
units:
    - name: "lightdm.service"
      action: "enable"
    # keeps the boot menu's list of snapshots current
    - name: "grub-btrfsd.service"
      action: "enable"
    # deletes the snapshots beyond the limit
    - name: "snapper-cleanup.timer"
      action: "enable"
    # record how far each boot gets, so that the next one opens in safe mode after a failure
    - name: "kavat-boot-greeter.service"
      action: "enable"
    - name: "kavat-boot-session.path"
      action: "enable"
    - name: "kavat-boot-desktop.path"
      action: "enable"
