# The new system is a copy of the live one, so it installs without a network.
# The copy is taken from where the live image is mounted, untouched by the live session.
# Not from the image file: with enough memory the live medium copies it to RAM at boot
# and lets go of the USB stick, so the file is no longer where it was.
---
unpack:
    - source: "/run/archiso/airootfs"
      sourcefs: "file"
      destination: ""
