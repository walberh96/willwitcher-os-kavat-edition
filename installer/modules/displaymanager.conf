# The login screen, and the session it starts: Hyprland, not its uwsm variant.
---
displaymanagers: [ lightdm ]
defaultDesktopEnvironment:
    executable: "start-hyprland"
    desktopFile: "hyprland"
basicSetup: false
sysconfigSetup: false
lightdm:
    preferred_greeters: [ "lightdm-gtk-greeter.desktop" ]
