# The login screen, and the session it starts: Hyprland, through kavat-session, which
# handles safe mode and tells the next boot how this one went.
---
displaymanagers: [ lightdm ]
defaultDesktopEnvironment:
    executable: "kavat-session"
    desktopFile: "kavat"
basicSetup: false
sysconfigSetup: false
lightdm:
    preferred_greeters: [ "lightdm-gtk-greeter.desktop" ]
