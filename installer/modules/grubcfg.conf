# GRUB's settings. Other systems on the machine get an entry; the firmware's own boot
# entries do not.
---
overwrite: false
prefer_grub_d: false
keep_distributor: false
# No "splash" here: Calamares adds it by itself when the system has Plymouth.
kernel_params: [ "quiet" ]
defaults:
    GRUB_TIMEOUT: 5
    GRUB_DEFAULT: 0
    GRUB_DISABLE_RECOVERY: true
    GRUB_DISABLE_OS_PROBER: false
    GRUB_DISABLE_BOOTNEXT: true
# The grub package already brings /etc/default/grub: without this, the values above are ignored.
always_use_defaults: true
