# Disks. The system goes on Btrfs, with no swap partition: memory is compressed instead.
---
efi:
    mountPoint: "/efi"
    recommendedSize: 1GiB
    minimumSize: 300MiB
    label: "EFI"
userSwapChoices: [ none ]
initialSwapChoice: none
initialPartitioningChoice: erase
defaultFileSystemType: "btrfs"
availableFileSystemTypes: [ "btrfs" ]
# Encryption is a switch, off unless the user turns it on. What makes it boot without a
# password is the luks-keys step.
enableLuksAutomatedPartitioning: true
preCheckEncryption: false
luksGeneration: luks2
drawNestedPartitions: false
alwaysShowPartitionLabels: true
essentialMounts: [ "live-*", "control", "ventoy" ]
lvm:
    enable: false
