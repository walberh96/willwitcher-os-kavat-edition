# Calamares, as Willwitcher-OS Kavat Edition runs it: what the installer asks, and what it
# then does, in order. Each step is a module; its settings are in modules/<name>.conf.
---
modules-search: [ local ]

instances:
- id: live
  module: shellprocess
  config: shellprocess-live.conf
- id: bootloader
  module: shellprocess
  config: shellprocess-bootloader.conf
- id: cleanup
  module: shellprocess
  config: shellprocess-cleanup.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  # takes out what belongs to the live medium; before the boot image is made
  - shellprocess@live
  - initcpiocfg
  - initcpio
  - users
  - removeuser
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - grubcfg
  - shellprocess@bootloader
  - shellprocess@cleanup
  - umount
- show:
  - finished

branding: kavat
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
