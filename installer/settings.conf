# Calamares, as Willwitcher-OS Kavat Edition runs it: what the installer asks, and what it
# then does, in order. Each step is a module; its settings are in modules/<name>.conf.
---
modules-search: [ local ]

instances:
- id: live
  module: shellprocess
  config: shellprocess-live.conf
- id: bootloader
  module: shellprocess
  config: shellprocess-bootloader.conf
- id: software
  module: notesqml
  config: software.conf
- id: appearance
  module: notesqml
  config: appearance.conf
- id: cleanup
  module: shellprocess
  config: shellprocess-cleanup.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - notesqml@software
  - notesqml@appearance
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  # the look chosen on the Appearance page; before the boot loader, which wears it
  - kavat-look
  - machineid
  # only with an encrypted disk; before the steps that look for its key file
  - luks-keys
  - fstab
  - locale
  - keyboard
  - localecfg
  # takes out what belongs to the live medium; before the boot image is made
  - shellprocess@live
  - users
  - removeuser
  - networkcfg
  - hwclock
  - services-systemd
  # the answers given, kept to repeat this installation; the next step adds the programs to them
  - kavat-answers
  # the programs checked on the Software page; before the boot image, which a package may add to
  - kavat-software
  - grubcfg
  - shellprocess@bootloader
  # after the boot loader, which puts the loading screen's look where the boot image takes it from
  - initcpiocfg
  - initcpio
  - shellprocess@cleanup
  - umount
- show:
  - finished

branding: kavat
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
